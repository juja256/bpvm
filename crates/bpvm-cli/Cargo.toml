[package]
name = "bpvm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Run an RV32IM ELF, prove its execution with bpvm and verify the proof"

[[bin]]
name = "bpvm"
path = "src/main.rs"

[dependencies]
bpvm-emu = { path = "../bpvm-emu" }
bpvm-zk = { path = "../bpvm-zk" }
bulletproofs.workspace = true
rand.workspace = true
serde_json = "1"

[features]
parallel = ["bpvm-zk/parallel"]
