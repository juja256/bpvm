[package]
name = "bpvm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Run an RV32IM ELF, prove its execution with bpvm and verify the proof"

[[bin]]
name = "bpvm"
path = "src/main.rs"

[dependencies]
bpvm-emu = { path = "../bpvm-emu" }
bpvm-zk = { path = "../bpvm-zk", default-features = false }
bulletproofs.workspace = true
rand.workspace = true
serde_json = "1"

[features]
default = ["bppp-vartime", "secp256k1"]
# `--curve secp256k1` (Liquid's curve) next to the default ristretto255.
secp256k1 = ["bpvm-zk/secp256k1"]
parallel = ["bpvm-zk/parallel"]
bppp-vartime = ["bpvm-zk/bppp-vartime"]
