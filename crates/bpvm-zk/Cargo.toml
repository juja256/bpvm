[package]
name = "bpvm-zk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bulletproofs R1CS gadgets for bpvm (reciprocal-argument lookups, ...)"

[dependencies]
bulletproofs.workspace = true
merlin.workspace = true
bpvm-emu = { path = "../bpvm-emu" }

[dev-dependencies]
curve25519-dalek.workspace = true
rand.workspace = true
# Soundness tests: a prover that skips its own checks (bulletproofs::r1cs::cheats).
bulletproofs = { workspace = true, features = ["cheats"] }

[features]
# Simplicity verifiers of guest proofs (secp256k1, SHA-256 transcript): `vm::simplicity`.
simplicity = ["bulletproofs/simplicity"]
# Multi-threaded prover and verifier (bulletproofs/parallel, rayon).
parallel = ["bulletproofs/parallel"]

[[example]]
name = "simplicity"
required-features = ["simplicity"]
