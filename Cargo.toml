[workspace]
resolver = "2"
members = ["crates/bpvm-emu", "crates/bpvm-zk", "crates/bpvm-cli"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The bulletproofs fork with the BP++ backend and the circuit builder (juja256/bulletproofs main, dc8d057: generic over the curve, ristretto255 by default).
bulletproofs = { git = "https://github.com/juja256/bulletproofs", rev = "dc8d05704297bf74f6bae2bc61551c3e0e7e0e62", features = ["yoloproofs", "bppp"] }
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "rand_core", "serde"] }
merlin = "3"
rand = "0.8"

[profile.release]
debug = false
