[workspace]
resolver = "2"
members = ["crates/bpvm-emu", "crates/bpvm-zk", "crates/bpvm-cli"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The bulletproofs fork with the BP++ backend and the circuit builder (juja256/bulletproofs main,
# d136c0e: generic over the curve, one ConstraintSystem trait, witnesses folded into product
# wires, the stage 4 Simplicity compiler preferring programs that fit their budget without annex,
# behind `simplicity`).
bulletproofs = { git = "https://github.com/juja256/bulletproofs", rev = "d136c0e6265d9fd1a175dd9b1419297a3319b18c" }
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "rand_core", "serde"] }
merlin = "3"
rand = "0.8"

[profile.release]
debug = false
