[workspace]
resolver = "2"
members = ["crates/bpvm-emu", "crates/bpvm-zk", "crates/bpvm-cli"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The bulletproofs fork with the BP++ backend and the circuit builder (juja256/bulletproofs main,
# b9633d2: generic over the curve, one ConstraintSystem trait, witnesses folded into product
# wires, BP++ proving the exact form of the inputs (shape rows), generator tables on secp256k1,
# the stage 4 Simplicity compiler preferring programs that fit their budget without annex,
# behind `simplicity`).
bulletproofs = { git = "https://github.com/juja256/bulletproofs", rev = "b9633d260fd47347294736d04a4723c675c2270c" }
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "rand_core", "serde"] }
merlin = "3"
rand = "0.8"

[profile.release]
debug = false
