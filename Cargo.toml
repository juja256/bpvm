[workspace]
resolver = "2"
members = ["crates/bpvm-emu", "crates/bpvm-zk", "crates/bpvm-cli"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The bulletproofs fork with the BP++ backend and the circuit builder (juja256/bulletproofs main, 109e7f9: generic over the curve
# and the Fiat–Shamir transcript; Simplicity verifiers behind `simplicity`).
bulletproofs = { git = "https://github.com/juja256/bulletproofs", rev = "109e7f91c36ddbb5487b3b2b88e4aa19ca1539d3", features = ["yoloproofs", "bppp", "sha256-transcript"] }
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "rand_core", "serde"] }
merlin = "3"
rand = "0.8"

[profile.release]
debug = false
