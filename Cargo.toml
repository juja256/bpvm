[workspace]
resolver = "2"
members = ["crates/bpvm-emu", "crates/bpvm-zk", "crates/bpvm-cli"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The bulletproofs fork with the BP++ backend and the circuit builder (juja256/bulletproofs main, 5b4439b: generic over the curve, ristretto255 by default).
bulletproofs = { git = "https://github.com/juja256/bulletproofs", rev = "5b4439b79ec3eaff0380b78c3319b0f4f630b0cd", features = ["yoloproofs", "bppp"] }
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "rand_core", "serde"] }
merlin = "3"
rand = "0.8"

[profile.release]
debug = false
