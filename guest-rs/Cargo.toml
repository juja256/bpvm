# Rust guests for bpvm: a separate workspace, built for riscv32im-unknown-none-elf
# (see .cargo/config.toml and README.md).
[workspace]
resolver = "2"
members = ["bpvm-guest", "ec-add", "ec-mini"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
