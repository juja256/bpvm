[package]
name = "ec-add"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of the host workspace (different target).
[workspace]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }

[features]
# Same program without the point addition: the step difference is the cost of one addition.
baseline = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
